version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smarthome-network
    restart: unless-stopped

  temperature-api:
    build: ./temperature-api
    container_name: smarthome-temperature-api
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    networks:
      - smarthome-network
    restart: unless-stopped

  app:
    build: ./smart_home
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome?sslmode=disable
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    networks:
      - smarthome-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge